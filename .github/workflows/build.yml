name: Build sys-ticon

on:
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_RUN: >-
        docker run --rm
        -v ${{ github.workspace }}:/workspace
        -v /tmp/libnx-install:/opt/devkitpro/libnx
        -w /workspace
        devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Submodule Update Checks ──────────────────────────────────────────

      - name: Check if Atmosphere has a newer release
        id: ams_check
        run: |
          CURRENT_COMMIT=$(git -C lib/ams rev-parse HEAD)
          echo "Current lib/ams commit: $CURRENT_COMMIT"

          RELEASE_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/Atmosphere-NX/Atmosphere/releases/latest)
          LATEST_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          echo "Latest Atmosphere release tag: $LATEST_TAG"

          REF_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/Atmosphere-NX/Atmosphere/git/ref/tags/${LATEST_TAG}")
          OBJ_TYPE=$(echo "$REF_JSON" | jq -r '.object.type')
          OBJ_SHA=$(echo "$REF_JSON" | jq -r '.object.sha')

          if [ "$OBJ_TYPE" = "tag" ]; then
            RELEASE_COMMIT=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/Atmosphere-NX/Atmosphere/git/tags/${OBJ_SHA}" \
              | jq -r '.object.sha')
          else
            RELEASE_COMMIT="$OBJ_SHA"
          fi
          echo "Atmosphere release commit: $RELEASE_COMMIT"

          if [ "$CURRENT_COMMIT" = "$RELEASE_COMMIT" ]; then
            echo "Submodule is already up to date."
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Submodule is outdated. Will update to $RELEASE_COMMIT."
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
            echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Update lib/ams submodule
        if: steps.ams_check.outputs.needs_update == 'true'
        run: |
          git -C lib/ams fetch --all
          git -C lib/ams checkout ${{ steps.ams_check.outputs.release_commit }}

      - name: Bump VERSION micro in Makefile
        if: steps.ams_check.outputs.needs_update == 'true'
        run: |
          CURRENT_VERSION=$(grep -Po '^VERSION\s*:=\s*\K\d+\.\d+\.\d+' Makefile)
          MICRO=$(echo "$CURRENT_VERSION" | cut -d. -f3)
          NEW_MICRO=$((MICRO + 1))
          NEW_VERSION=$(echo "$CURRENT_VERSION" | sed "s/\.[0-9]*$/\.${NEW_MICRO}/")
          sed -i "s/\(VERSION\s*:=\s*\)${CURRENT_VERSION}/\1${NEW_VERSION}/" Makefile
          echo "Bumped VERSION: $CURRENT_VERSION -> $NEW_VERSION"

      - name: Commit and push submodule update
        if: steps.ams_check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ams Makefile
          git commit -m "chore: update lib/ams to Atmosphere ${{ steps.ams_check.outputs.latest_tag }}, bump VERSION_MICRO"
          git push

      - name: Clone libnx (master)
        run: |
          git clone --depth 1 https://github.com/switchbrew/libnx.git /tmp/libnx-src
          echo "libnx commit: $(git -C /tmp/libnx-src rev-parse HEAD)"
          mkdir -p /tmp/libnx-install

      - name: Build and install libnx
        run: |
          docker run --rm \
            -v /tmp/libnx-src:/libnx-src \
            -v /tmp/libnx-install:/libnx-out \
            -w /libnx-src \
            devkitpro/devkita64:latest \
            bash -c 'make -j$(nproc) install && cp -a "$DEVKITPRO/libnx/." /libnx-out/'

      - name: Build libstrato
        run: $DOCKER_RUN make -j4 libstrato

      - name: Build (default)
        run: |
          $DOCKER_RUN make -j4
          sudo chown -R $USER:$USER . # Fix permissions for files created by Docker root user

      - name: Pack default build
        run: zip -r default.zip out/

      - name: Upload default.zip
        uses: actions/upload-artifact@v7
        with:
          name: default
          path: default.zip

      - name: Clean
        run: $DOCKER_RUN make clean

      - name: Build (logging)
        run: |
          $DOCKER_RUN make TOGL_LOGGING=1 -j4
          sudo chown -R $USER:$USER . # Fix permissions for files created by Docker root user

      - name: Pack log build
        run: zip -r log.zip out/

      - name: Upload log.zip
        uses: actions/upload-artifact@v7
        with:
          name: log
          path: log.zip
